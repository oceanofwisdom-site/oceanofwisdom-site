name: Open image hosting and cross-browser audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-image-browser-audit.yml'
      - 'scripts/mirror_open_images.py'
      - 'scripts/browser_image_test.py'
      - '**/*.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Mirror open-licensed Commons images into the site
        run: python scripts/mirror_open_images.py
      - name: Start local site server
        run: |
          python -m http.server 8000 --directory . > /tmp/oow-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
      - name: Test image rendering in desktop and mobile browser profiles
        run: python scripts/browser_image_test.py
      - name: Commit self-hosted images and attribution records
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' assets/open-images scripts
            git commit -m "Self-host open-licensed images and verify browser rendering"
            git push
          else
            echo "No Wikimedia image URLs needed mirroring."
          fi

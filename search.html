(e){const q=document.getElementById('oow-query').value.trim();if(!q){e.preventDefault();return;}this.querySelectorAll('input[type=hidden]').forEach(x=>x.remove());const h=document.createElement('input');h.type='hidden';h.name='q';h.value='site:www.oceanofwisdom.site '+q;this.appendChild(h);document.getElementById('oow-query').removeAttribute('name');});</script><nav class="links" aria-label="Related pages"><a href="/">⌂ Home</a><a href="/search.html">Search</a><a href="/editorial-policy.html">Editorial Policy</a><a href="/contact.html">Contact</a></nav></main></body></html>

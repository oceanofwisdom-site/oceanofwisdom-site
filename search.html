<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d35">
<title>Search Ocean of Wisdom | Knowledge, Tools &amp; Research</title>
<meta name="description" content="Search Ocean of Wisdom pages, interactive tools, classical languages, literature and open-access research.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.oceanofwisdom.site/search.html">
<link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/ocean-global.css"><script src="/ocean-global.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101d35;color:#edf1f7;font:16px/1.7 'Noto Sans',sans-serif}.page{max-width:980px;margin:0 auto;padding:24px 20px 70px}h1,h2{color:#f0d58d;line-height:1.25}h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.lead{color:#d2dce9;font-size:17px}.search-form{display:flex;gap:10px;margin:24px 0 10px}.search-form input{flex:1;min-width:0;padding:15px 16px;border:2px solid #55d5e2;border-radius:12px;background:#172b49;color:#fff;font:inherit}.search-form button{padding:12px 20px;border:1px solid #d8ad43;border-radius:12px;background:#d8ad43;color:#101d35;font-weight:800;cursor:pointer}.search-form input:focus-visible,.search-form button:focus-visible,a:focus-visible{outline:3px solid #55d5e2;outline-offset:3px}.status{min-height:28px;color:#9edee4;font-size:14px;margin:8px 0 18px}.result{background:#172b49;border:1px solid #d8ad4377;border-radius:13px;padding:17px 19px;margin:12px 0}.result h2{font-size:19px;margin:0 0 4px}.result h2 a{color:#73d9df;text-decoration:none}.result .url{font-size:12px;color:#d8ad43;overflow-wrap:anywhere}.result p{margin:8px 0 0;color:#d2dce9;font-size:14px}.empty{padding:18px;border:1px dashed #6685a9;border-radius:12px;color:#d2dce9}.back{display:inline-block;margin-top:26px;color:#f0d58d;text-decoration:none;border:1px solid #d8ad43;border-radius:24px;padding:8px 15px}@media(max-width:560px){.page{padding:20px 14px 48px}.search-form{gap:7px}.search-form input{padding:12px 10px;font-size:15px}.search-form button{padding:10px 13px}.result{padding:14px}}
</style>
</head>
<body>
<main class="page">
<h1>Search Ocean of Wisdom</h1>
<p class="lead">Search across knowledge pages, interactive tools, classical languages, literature and research resources.</p>
<form class="search-form" id="site-search-form" role="search">
<input id="site-search-query" type="search" name="q" placeholder="Try astronomy, Sanskrit, water engineering, Buddhism…" aria-label="Search all Ocean of Wisdom pages" required>
<button type="submit">Search</button>
</form>
<p class="status" id="search-status" role="status" aria-live="polite">Enter a topic to search the website.</p>
<section id="search-results" aria-label="Search results"></section>
<a class="back" href="/">⌂ Return to Ocean of Wisdom</a>
</main>
<script>
(()=>{'use strict';
const form=document.getElementById('site-search-form'),input=document.getElementById('site-search-query'),status=document.getElementById('search-status'),results=document.getElementById('search-results');
let indexPromise=null;
const norm=s=>String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
function excerpt(text,terms){const t=clean(text);const n=norm(t);let at=-1;for(const term of terms){const p=n.indexOf(term);if(p>=0&&(at<0||p<at))at=p}if(at<0)return t.slice(0,230)+(t.length>230?'…':'');const start=Math.max(0,at-95),end=Math.min(t.length,at+175);return (start?'…':'')+t.slice(start,end)+(end<t.length?'…':'')}
async function loadIndex(){
 if(indexPromise)return indexPromise;
 indexPromise=(async()=>{
  status.textContent='Preparing the site search index…';
  const sitemap=await fetch('/sitemap.xml',{cache:'no-cache'});if(!sitemap.ok)throw new Error('The site map could not be loaded.');
  const xml=new DOMParser().parseFromString(await sitemap.text(),'application/xml');
  const urls=[...xml.querySelectorAll('loc')].map(n=>n.textContent.trim()).filter(u=>{try{const x=new URL(u,location.origin);return x.origin===location.origin&&!/\/search\.html$|googlefc697bcb5c73cf72\.html$/.test(x.pathname)}catch{return false}});
  const docs=[];
  for(let i=0;i<urls.length;i+=8){
   const batch=urls.slice(i,i+8);
   const found=await Promise.all(batch.map(async url=>{
    try{const response=await fetch(url,{cache:'force-cache'});if(!response.ok)return null;const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,nav,footer,header,form,noscript').forEach(n=>n.remove());const title=clean(doc.querySelector('title')?.textContent||url);const description=clean(doc.querySelector('meta[name="description"]')?.content||'');const main=doc.querySelector('main,article')||doc.body;const body=clean(main?.textContent||'').slice(0,50000);return {url,title,description,body,lang:doc.documentElement.lang||'en'};}catch{return null}
   }));
   docs.push(...found.filter(Boolean));status.textContent='Indexing website pages… '+Math.min(i+batch.length,urls.length)+' / '+urls.length;
  }
  if(!docs.length)throw new Error('No pages could be indexed. Try the external search fallback below.');
  return docs;
 })();
 return indexPromise;
}
function addResult(item,query,terms){
 const article=document.createElement('article');article.className='result';
 const h=document.createElement('h2'),a=document.createElement('a');a.href=item.url;a.textContent=item.title;h.appendChild(a);
 const u=document.createElement('div');u.className='url';u.textContent=new URL(item.url).pathname;
 const p=document.createElement('p');p.textContent=excerpt(item.description+' '+item.body,terms);
 article.append(h,u,p);results.appendChild(article);
}
function addFallback(query){const box=document.createElement('div');box.className='empty';const p=document.createElement('p');p.textContent='No strong match was found in the indexed Ocean of Wisdom pages. You can broaden the search using the external site-search option.';const a=document.createElement('a');a.href='https://www.google.com/search?q='+encodeURIComponent('site:www.oceanofwisdom.site '+query);a.target='_blank';a.rel='noopener';a.textContent='Search the Ocean of Wisdom domain with Google';a.style.color='#73d9df';box.append(p,a);results.appendChild(box)}
async function runSearch(query){
 results.replaceChildren();const terms=norm(query).split(/[^\p{L}\p{N}]+/u).filter(x=>x.length>1);
 if(!terms.length){status.textContent='Please enter a topic or keyword.';return}
 try{
  const docs=await loadIndex();
  const ranked=docs.map(item=>{const title=norm(item.title),desc=norm(item.description),url=norm(item.url),body=norm(item.body);let score=0;for(const term of terms){if(title.includes(term))score+=9;if(desc.includes(term))score+=5;if(url.includes(term))score+=4;const hits=body.split(term).length-1;score+=Math.min(hits,8)}if(title.includes(norm(query)))score+=12;return {...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,20);
  status.textContent=ranked.length+' relevant page'+(ranked.length===1?'':'s')+' found across '+docs.length+' indexed pages.';
  if(!ranked.length){addFallback(query);return}
  ranked.forEach(item=>addResult(item,query,terms));
  const fallback=document.createElement('p');fallback.style.marginTop='18px';const link=document.createElement('a');link.href='https://www.google.com/search?q='+encodeURIComponent('site:www.oceanofwisdom.site '+query);link.target='_blank';link.rel='noopener';link.textContent='Not finding what you need? Broaden this search with Google.';link.style.color='#73d9df';fallback.appendChild(link);results.appendChild(fallback);
 }catch(error){status.textContent=error.message;addFallback(query)}
}
form.addEventListener('submit',event=>{event.preventDefault();const q=input.value.trim();if(!q)return;const url=new URL(location.href);url.searchParams.set('q',q);history.replaceState(null,'',url);runSearch(q)});
const initial=new URLSearchParams(location.search).get('q');if(initial){input.value=initial;runSearch(initial)}
})();
</script>
</body></html>
